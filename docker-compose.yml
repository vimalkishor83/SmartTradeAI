version: '3.8'

# Docker's default json-file log driver has no size cap at all — container
# stdout/stderr (gunicorn access logs, worker output, every print/log line)
# accumulates on the host disk forever otherwise. 10MB x 3 files = 30MB max
# per container, auto-rotated by Docker itself; applied to every service
# below via the *default-logging anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smarttrade}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smarttrade_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      # Web tier owns NO background work — the `worker` service below runs the
      # scheduler and exchange stream exactly once. This is what makes it safe
      # to raise GUNICORN_WORKERS above 1 or run multiple app replicas.
      - RUN_SCHEDULER=0
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      # /ready (not /health): 503s when DB/Redis/scheduler are unusable, so an
      # orchestrator stops routing traffic to a process that cannot serve it.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/ready', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Exactly ONE of these. Owns the APScheduler roster and the Delta Exchange
  # WebSocket ingest; binds no HTTP port. Never scale this service above 1 —
  # doing so reintroduces the duplicate-background-work problem the split
  # exists to solve.
  worker:
    build: .
    logging: *default-logging
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smarttrade}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smarttrade_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - RUN_SCHEDULER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smarttrade_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarttrade} -d ${POSTGRES_DB:-smarttrade_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to the host by default — the app container reaches it over
    # the compose network. Uncomment only if you need external DB access.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Password-protected and NOT published to the host. Previously this mapped
    # 6379:6379 with no auth, which on any host without a firewall exposed the
    # cache AND the rate-limiter store to the internet — an attacker could read
    # cached data or flush rate-limit counters. The app container reaches it
    # over the compose network by service name, so no host port is needed.
    # Uncomment the ports block only for local debugging.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
