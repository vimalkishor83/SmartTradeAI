{% extends "partials/base.html" %}
{% block title %}System Logs — SmartTrade AI{% endblock %}
{% set active = 'admin_logs' %}
{% block breadcrumb %}<i class="bi bi-list-ul me-2"></i> Admin / Logs{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1 class="page-title">System Logs</h1></div>
  <select class="form-select form-select-sm" id="levelFilter" style="width:auto">
    <option value="">All Levels</option>
    <option value="INFO">INFO</option>
    <option value="WARNING">WARNING</option>
    <option value="ERROR">ERROR</option>
    <option value="CRITICAL">CRITICAL</option>
  </select>
</div>

<div class="section-card">
  <div id="logsBody">
    <div class="text-center py-5" style="color:var(--text-muted)"><i class="bi bi-journal-text" style="font-size:2rem;opacity:.3;display:block;margin-bottom:10px"></i>No logs found</div>
  </div>
  <div class="p-3"><nav><ul class="pagination pagination-sm mb-0" id="logsPagination"></ul></nav></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadLogs(page = 1) {
  const level = document.getElementById('levelFilter').value;
  const params = { page, per_page: 50 };
  if (level) params.level = level;
  const data = await API.get('/admin/system-logs', params);
  if (!data) return;

  // Map log levels to the .log-level.info|warn|error component classes
  const LEVEL_CLASS = { INFO: 'info', WARNING: 'warn', ERROR: 'error', CRITICAL: 'error' };
  if (!data.logs?.length) {
    document.getElementById('logsBody').innerHTML = '<div class="text-center py-5" style="color:var(--text-muted)"><i class="bi bi-journal-text" style="font-size:2rem;opacity:.3;display:block;margin-bottom:10px"></i>No logs found</div>';
    return;
  }
  document.getElementById('logsBody').innerHTML = data.logs.map(l => `
    <div class="log-line">
      <span class="log-time">${formatTime(l.created_at)}</span>
      <span class="log-level ${LEVEL_CLASS[l.level] || 'info'}">${l.level}</span>
      <span class="log-msg">${l.module ? `<strong style="color:var(--text-muted)">[${l.module}]</strong> ` : ''}${l.message}</span>
    </div>`).join('');
}

document.getElementById('levelFilter').addEventListener('change', () => loadLogs(1));
document.addEventListener('app:ready', () => loadLogs());
</script>
{% endblock %}
