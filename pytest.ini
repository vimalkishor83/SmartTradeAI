[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is reported but NOT gated on a minimum percentage yet: the current
# suite deliberately covers the financial-consequence code (risk sizing, order
# signing, tax classification) rather than the whole app, so a --cov-fail-under
# set to today's number would only lock in the status quo. Use the
# term-missing report to see the untested surface shrink over time, then add a
# floor once auth/signal paths are covered.
addopts = --cov=app --cov-report=term-missing:skip-covered --cov-report=
