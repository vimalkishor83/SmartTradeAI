name: CI

# Runs on every push and PR. Before this existed there was no automated gate
# at all: the test suite only ran when a developer chose to type `pytest`,
# so nothing prevented untested or broken code from landing.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # A new push to the same branch cancels the previous in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # TestingConfig uses in-memory SQLite; these keep get_config() on the
      # development/testing path and out of the production guards.
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-not-used-in-production
      JWT_SECRET_KEY: ci-jwt-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations reversible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Runs against a real Postgres, not SQLite: the production target is
    # Postgres (docker-compose), and some DDL that silently succeeds under
    # SQLite's batch_alter_table emulation behaves differently there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarttrade
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smarttrade_ci
        options: >-
          --health-cmd "pg_isready -U smarttrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      FLASK_ENV: development
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql://smarttrade:ci_password@localhost:5432/smarttrade_ci
      SECRET_KEY: ci-secret-not-used-in-production
      JWT_SECRET_KEY: ci-jwt-secret-not-used-in-production
      # No proxy in front of the CI process.
      TRUSTED_PROXY_COUNT: '0'
      # Don't start the scheduler or the exchange WebSocket during a migration
      # check — this job only exercises schema DDL.
      RUN_SCHEDULER: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Proves every migration is genuinely reversible. All 25+ existing
      # migrations have real downgrade() bodies, but nothing verified that
      # claim before a change reached production — where an irreversible
      # migration means no rollback path during an incident.
      - name: Upgrade to head
        run: flask db upgrade

      - name: Downgrade to base
        run: flask db downgrade base

      - name: Re-upgrade to head
        run: flask db upgrade

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Reports known CVEs in pinned dependencies. Non-blocking for now
      # (continue-on-error) so an upstream advisory published overnight can't
      # block an unrelated hotfix; review the job output and drop this flag
      # once the dependency set is being actively maintained.
      - name: Audit dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict
