name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smarttrade-production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run test suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for database migration changes
        id: migration_check
        shell: bash
        run: |
          set -euo pipefail
          # github.event.before is the tip of main right before this push;
          # on the very first push to a new branch history it's the all-
          # zero SHA, which git treats as "diff against nothing" -- fall
          # back to the previous commit on this branch in that case so the
          # check never silently no-ops on an edge case instead of erroring.
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="HEAD~1"
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}" -- migrations/versions/ || true)
          if [[ -n "$changed" ]]; then
            echo "has_migration_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "## This push includes database migration changes"
              echo ""
              echo "Changed migration files:"
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_migration_files=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify production database is on this push's target migration
        if: steps.migration_check.outputs.has_migration_files == 'true'
        shell: bash
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # This push touches migrations/versions/. Deploying the new code
          # without the matching schema change already applied is exactly
          # what caused a production outage on 2026-09-19 (PlatformConfig
          # gained a column in code; the migration was never run by hand;
          # every page that reads PlatformConfig started throwing
          # UndefinedColumn and 500ing). Rather than a soft warning someone
          # could miss, this asks the production database itself what
          # revision it's on and hard-fails the whole job -- before the
          # approval gate, before any container is touched -- unless it
          # already matches this push's own migration head. Migrations
          # are still never run automatically; this only stops an
          # unmigrated deploy from proceeding, it never runs one itself.
          [[ -n "$PRODUCTION_DEPLOY_KEY" ]] || {
            echo "::error::PRODUCTION_DEPLOY_KEY is not configured -- cannot verify migration state" >&2
            exit 1
          }

          # Ask Alembic itself for the head, rather than hand-parsing
          # migration files -- this repo's migration graph has at least
          # one merge migration (a down_revision tuple joining two
          # branches), which a naive regex/diff parser mis-reads as two
          # separate unmerged heads. `flask db heads` already understands
          # merge revisions correctly. FLASK_APP is set explicitly since
          # this runs outside the app's Docker image (no baked-in env),
          # relying only on the wsgi.py entrypoint already at the repo root.
          heads_output=$(FLASK_APP=wsgi.py FLASK_ENV=testing flask db heads 2>/dev/null)
          head_count=$(echo "$heads_output" | grep -cE '^[a-z0-9]+' || true)
          if [[ "$head_count" -ne 1 ]]; then
            echo "::error::Expected exactly one migration head, found $head_count: $(echo "$heads_output" | tr '\n' ' ')" >&2
            exit 1
          fi
          alembic_head=$(echo "$heads_output" | grep -oE '^[a-z0-9]+' | head -1)

          key_file="$RUNNER_TEMP/smarttradeai-migration-check-key"
          umask 077
          printf '%s\n' "$PRODUCTION_DEPLOY_KEY" > "$key_file"
          trap 'rm -f -- "$key_file"' EXIT

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "140.238.247.245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIETGjq7bv3bnXPVw9+6hhli2nob5qD0AJGjU5JJRGt+9" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # flask db current writes noisy eventlet/deprecation warnings to
          # stderr before the actual "<revision> (head)" line on stdout --
          # 2>/dev/null drops those, so the first remaining line is the
          # real revision (this repo's migration ids are hand-picked
          # alnum strings, e.g. "s2g3h4i5j6k7", not real hex hashes).
          db_revision=$(ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            ubuntu@140.238.247.245 \
            "docker exec smarttradeai-app-1 flask db current 2>/dev/null | grep -oE '^[a-z0-9]+' | head -1" || echo "UNKNOWN")

          echo "This push's migration head: $alembic_head"
          echo "Production database revision: $db_revision"

          if [[ "$db_revision" == "UNKNOWN" || -z "$db_revision" ]]; then
            echo "::error::Could not read the production database's current migration revision. Refusing to deploy a push with migration changes until this is confirmed manually." >&2
            exit 1
          fi

          if [[ "$db_revision" != "$alembic_head" ]]; then
            echo "::error::Production database is at revision '$db_revision' but this push expects '$alembic_head'. Run the migration by hand before re-running this workflow: ssh ubuntu@140.238.247.245 sudo -n -- /usr/local/sbin/smarttrade-deploy-production --confirm-production --execute --run-migrations" >&2
            exit 1
          fi

          echo "Production database is already on this push's target migration -- safe to deploy."

      - name: Run full test suite
        env:
          FLASK_ENV: testing
        run: python -m pytest -q --no-cov --durations=30

  deploy:
    name: Deploy to smarttradeai.online
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This environment has a required-reviewer rule configured in the repo
    # settings (Settings > Environments > production). The job pauses here
    # until someone with approval rights clicks Approve on the run — tests
    # having passed above does not skip this gate. This is the deliberate
    # manual checkpoint for production, mirroring the --confirm-production
    # --execute gates the deploy script itself also requires.
    environment: production
    env:
      DEPLOYMENT_URL: https://smarttradeai.online
      SERVER_HOST: 140.238.247.245
      SERVER_USER: ubuntu
      REMOTE_COMMAND: /usr/local/sbin/smarttrade-deploy-production
      # Pinned server host key. This is public host identity material, not a secret.
      SERVER_HOST_KEY: 140.238.247.245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIETGjq7bv3bnXPVw9+6hhli2nob5qD0AJGjU5JJRGt+9

    steps:
      - name: Confirm main-only target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$REMOTE_COMMAND" == "/usr/local/sbin/smarttrade-deploy-production" ]]
          [[ "$DEPLOYMENT_URL" == "https://smarttradeai.online" ]]
          echo "Deploying commit $GITHUB_SHA to $DEPLOYMENT_URL"

      - name: Configure pinned server host key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SERVER_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy production
        shell: bash
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$PRODUCTION_DEPLOY_KEY" ]] || {
            echo "::error::PRODUCTION_DEPLOY_KEY is not configured" >&2
            exit 1
          }

          key_file="$RUNNER_TEMP/smarttradeai-production-deploy-key"
          umask 077
          printf '%s\n' "$PRODUCTION_DEPLOY_KEY" > "$key_file"
          trap 'rm -f -- "$key_file"' EXIT

          # --run-migrations is intentionally NOT passed here. Running a
          # migration is a separate, deliberate manual action (ssh ... sudo
          # -n -- smarttrade-deploy-production --confirm-production
          # --execute --run-migrations), never automatic on every push to
          # main. The "Verify production database is on this push's target
          # migration" step in the test job above already refuses to reach
          # this point at all if this push needs a migration that hasn't
          # been run yet -- so reaching this step means either this push
          # has no migration changes, or its migration was already applied
          # by hand before this run started.
          timeout --signal=TERM --kill-after=30s 10m \
            ssh \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              "$SERVER_USER@$SERVER_HOST" \
              sudo -n -- "$REMOTE_COMMAND" --confirm-production --execute

      - name: Deployment failed
        if: failure()
        shell: bash
        run: |
          echo "::error::Production deployment failed or timed out for $GITHUB_SHA"
          echo "Target: $DEPLOYMENT_URL"

      - name: Deployment succeeded
        if: success()
        shell: bash
        run: |
          echo "Production deployment completed for $GITHUB_SHA"
          echo "Target: $DEPLOYMENT_URL"
